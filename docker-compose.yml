services:
  cubixx-bridge:
    build: .
    container_name: cubixx-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    # Optional: pre-fill the broker settings (you can also set them in the web UI).
    # environment:
    #   MQTT_HOST: 192.168.1.10
    #   MQTT_PORT: "1883"
    #   MQTT_USER: cubixx
    #   MQTT_PASS: secret
