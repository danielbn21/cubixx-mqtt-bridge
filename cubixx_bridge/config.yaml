name: "Cubixx MQTT Bridge"
version: "1.0.1"
slug: cubixx_bridge
description: "Bridge Cubixx relay switches to MQTT, with Home Assistant discovery and a web UI"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: "mdi:light-switch"
panel_title: "Cubixx"
watchdog: "tcp://[HOST]:[PORT:8080]"
services:
  - mqtt:want
# Optional overrides. Leave empty to use the Home Assistant MQTT broker automatically.
options: {}
schema:
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
